# Render's free plan sleeps after 15 idle minutes. /livez doesn't touch the database, so this
# doesn't keep Neon awake.
name: Keep API awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: vars.RITAM_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.RITAM_API_URL }}/livez"
