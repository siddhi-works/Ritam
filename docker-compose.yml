name: ritam

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ritam
      POSTGRES_PASSWORD: ritam
      POSTGRES_DB: ritam
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ritam"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Optional graph projection (rebuilt from Postgres). Start it with:
  #   docker compose --profile graph up -d
  # Without it, the graph view is computed from Postgres instead.
  neo4j:
    image: neo4j:5-community
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-ritam-local-dev}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4jdata:/data]

  api:
    build:
      context: ./backend
      args: { WITH_BROWSER: "1" }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ritam:ritam@postgres:5432/ritam
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_QUERY_API_URL: ""
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-ritam-local-dev}
    ports: ["8000:8000"]
    volumes: [rawdata:/app/data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: ./backend
      args: { WITH_BROWSER: "1" }
    command: ["arq", "app.worker.WorkerSettings"]
    volumes: [rawdata:/app/data]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ritam:ritam@postgres:5432/ritam
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_QUERY_API_URL: ""
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-ritam-local-dev}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  rawdata:
  pgdata:
  neo4jdata:
